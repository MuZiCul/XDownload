name: Release

# 打 v* 标签（如 v2.8.1）推送后自动：编译 exe/msi + 打包扩展 + 创建 GitHub Release。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 需要完整历史 + 所有 tag，用于自动生成 changelog。
          fetch-depth: 0

      # ---------- 版本号（唯一数据源 Cargo.toml，tag 与之对应） ----------
      - name: Extract version from tag
        id: version
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT

      # ---------- 前端依赖 ----------
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install pnpm
        shell: pwsh
        run: npm install -g pnpm

      - name: Install UI dependencies
        working-directory: ui
        shell: pwsh
        run: pnpm install --frozen-lockfile

      # ---------- Rust + MSI 工具 ----------
      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install WiX (MSI toolset)
        shell: pwsh
        run: choco install wixtoolset -y --no-progress

      # ---------- Release 正文 ----------
      # 大版本（minor，如 2.7→2.8）：写 RELEASE/RELEASE_vX.Y.Z.md，优先使用。
      # 小版本（patch，如 2.7.1→2.7.2）：不写文件，从 git log 自动生成 changelog。
      - name: Generate release body
        id: body
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $releaseFile = "RELEASE/RELEASE_v$version.md"
          if (Test-Path $releaseFile) {
            Copy-Item $releaseFile "body.md" -Force
          } else {
            $tag = "${{ github.ref_name }}"
            $prev = git tag --list "v*" --sort=-v:refname | Where-Object { $_ -ne $tag } | Select-Object -First 1
            # Tag already carries the version number, so omit it from the body.
            # Group commits by type (New/Changed/Fixed/Removed); omit sections without entries.
            # Keep this script pure ASCII so it parses correctly under Windows PowerShell 5.1.
            # Read commit subjects as UTF-8: force git to write the log to a
            # temp file (git writes raw UTF-8 bytes, bypassing PowerShell pipe
            # decoding), then read it back with explicit UTF-8. This avoids
            # PowerShell decoding git's UTF-8 output as GBK on Windows runners,
            # which corrupts non-ASCII commit subjects.
            $logFile = "gitlog.txt"
            if ($prev) {
              git log "$prev..HEAD" --no-merges --pretty=format:"%s" --output=$logFile
            } else {
              Set-Content -Path $logFile -Value "Initial release" -Encoding ascii
            }
            $lines = @(Get-Content -Path $logFile -Encoding utf8) | Select-Object -First 60
            Remove-Item $logFile -ErrorAction SilentlyContinue
            $sections = [ordered]@{
              "New" = @(); "Changed" = @(); "Fixed" = @(); "Removed" = @(); "Other" = @()
            }
            foreach ($l in $lines) {
              if ($l -match '^feat(\([^)]*\))?:') { $sections["New"] += $l }
              elseif ($l -match '^fix(\([^)]*\))?:') { $sections["Fixed"] += $l }
              elseif ($l -match '^(refactor|perf|improve|style|docs)(\([^)]*\))?:') { $sections["Changed"] += $l }
              elseif ($l -match '^(remove|delete|drop)(\([^)]*\))?:') { $sections["Removed"] += $l }
              else { $sections["Other"] += $l }
            }
            $body = @()
            foreach ($k in $sections.Keys) {
              if ($sections[$k].Count -gt 0) {
                $body += "## $k"
                foreach ($i in $sections[$k]) { $body += "- $i" }
                $body += ""
              }
            }
            Set-Content -Path "body.md" -Value ($body -join "`n") -Encoding utf8NoBOM
          }
          Write-Output "body_path=$env:GITHUB_WORKSPACE\body.md" >> $env:GITHUB_OUTPUT

      # ---------- 构建（beforeBuildCommand 自动跑前端） ----------
      # 用项目自带的 @tauri-apps/cli（pnpm install 已装，版本 ^2.11.4 精确匹配），
      # 从项目根调用 node 脚本，与本地 debug_build.bat 一致。
      # TAURI_SIGNING_PRIVATE_KEY：构建时对安装包签名（minisign），生成 .sig 供
      # 官方 updater 校验（tauri.conf.json 的 plugins.updater.pubkey 对应）。
      - name: Build desktop app (frontend + Rust + installers)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node ui/node_modules/@tauri-apps/cli/tauri.js build

      # ---------- 生成 updater 清单 latest.json ----------
      # 官方 updater 通过 endpoints 拉取 latest.json（含签名与下载 URL）判断更新。
      # Windows 安装包仅用 NSIS (.exe) 作为更新载体；URL 指向本 Release 资产，
      # 因此客户端统一访问 …/releases/latest/download/latest.json 即可。
      - name: Generate updater latest.json
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $nsisDir = "target/release/bundle/nsis"
          $exe = Get-ChildItem "$nsisDir/*.exe" | Select-Object -First 1
          $sig = Get-ChildItem "$nsisDir/*.exe.sig" | Select-Object -First 1
          if (-not $exe -or -not $sig) { Write-Error "Missing NSIS exe or .sig"; exit 1 }
          $sigContent = (Get-Content $sig.FullName -Raw).Trim()
          $url = "https://github.com/MuZiCul/XDownload/releases/download/v$version/$($exe.Name)"
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $json = [ordered]@{
            version   = $version
            pub_date  = $pubDate
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sigContent
                url       = $url
              }
            }
          }
          $json | ConvertTo-Json -Depth 5 | Set-Content "latest.json" -Encoding utf8
          Write-Output "latest.json generated for v$version"

      # ---------- 扩展 zip（固定随发版） ----------
      - name: Build extension zip
        working-directory: extension
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1

      # ---------- 创建 Release + 上传资产 ----------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: XDownload v${{ steps.version.outputs.version }}
          body_path: ${{ steps.body.outputs.body_path }}
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msi.sig
            extension/dist/*.zip
            latest.json
